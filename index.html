
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Digital Book</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>

/* =========================================================
   GLOBAL
   ========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
}

body {
    font-family: Arial, Tahoma, sans-serif;
    color: #735a92;

    background:
        radial-gradient(
            ellipse 68% 68% at 0% 0%,
            rgba(218, 194, 255, 0.98) 0%,
            rgba(226, 205, 255, 0.84) 24%,
            rgba(239, 228, 255, 0.48) 48%,
            rgba(255, 255, 255, 0) 74%
        ),
        radial-gradient(
            ellipse 72% 72% at 100% 100%,
            rgba(245, 223, 145, 0.98) 0%,
            rgba(248, 228, 158, 0.82) 25%,
            rgba(255, 241, 188, 0.48) 48%,
            rgba(255, 255, 255, 0) 74%
        ),
        radial-gradient(
            ellipse 72% 72% at 50% 50%,
            rgba(255, 255, 255, 0.94) 0%,
            rgba(255, 255, 255, 0.88) 32%,
            rgba(255, 255, 255, 0.48) 58%,
            rgba(255, 255, 255, 0.08) 100%
        );

    transition: background 0.25s ease;
}

/* =========================================================
   APP
   ========================================================= */

.app {
    width: 100%;
    height: var(--viewport-height, 100dvh);

    display: flex;
    flex-direction: column;
    align-items: center;

    min-height: 0;

    padding:
        10px
        10px
        max(10px, env(safe-area-inset-bottom));

    overflow: hidden;
}

/* =========================================================
   BOOK WRAPPER
   ========================================================= */

.book-wrap {
    width: min(1250px, 99vw);

    flex: 1 1 auto;
    min-height: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

/* =========================================================
   BOOK
   ========================================================= */

.book {
    width: 100%;
    height: 100%;

    position: relative;

    background: #ffffff;

    border-radius: 18px;

    overflow: hidden;

    box-shadow:
        0 8px 24px rgba(130, 105, 175, 0.16),
        0 20px 70px rgba(80, 55, 110, 0.18);
}

/* =========================================================
   PAGE CONTENT
   ========================================================= */

.page-inner {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    background: #ffffff;

    overflow: hidden;

    touch-action: none;
}

/* =========================================================
   PDF CANVAS
   ========================================================= */

#pdfCanvas {
    display: block;

    background: #ffffff;

    max-width: 100%;
    max-height: 100%;

    transform-origin: 50% 50%;

    will-change: transform;

    user-select: none;
    -webkit-user-select: none;

    cursor: default;
}

/* =========================================================
   LOADING
   ========================================================= */

#loading {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(255, 255, 255, 0.18);

    color: #735a92;

    font-size: 15px;

    z-index: 5;

    pointer-events: none;
}

/* =========================================================
   CONTROL PANEL
   ========================================================= */

.controls {
    width: min(1250px, 99vw);

    height: var(--controls-height, 61px);

    flex: 0 0 auto;

    margin-top: 14px;

    padding: 11px 15px;

    display: flex;
    align-items: center;

    gap: 10px;

    border-radius: 17px;

    background: rgba(255, 255, 255, 0.48);

    border: 1px solid rgba(255, 255, 255, 0.78);

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    box-shadow:
        0 8px 24px rgba(130, 105, 175, 0.16),
        0 2px 7px rgba(130, 105, 175, 0.10),
        inset 0 1px 0 rgba(255, 255, 255, 0.85);

    overflow: hidden;

    z-index: 20;
}
#volumeControl {
    width: 70px;
    height: 4px;
    cursor: pointer;
    flex: 0 0 auto;
}

/* =========================================================
   CONTROL BUTTONS
   ========================================================= */

.control-button {
    width: 43px;
    height: 39px;

    flex-shrink: 0;

    border-radius: 11px;

    cursor: pointer;

    font-size: 18px;
    font-weight: 500;

    background:
        linear-gradient(
            145deg,
            rgba(226, 210, 255, 0.88),
            rgba(205, 183, 244, 0.82)
        );

    border: 1px solid rgba(178, 151, 222, 0.55);

    color: #76599f;

    box-shadow:
        0 4px 10px rgba(125, 95, 170, 0.18),
        inset 0 1px 1px rgba(255, 255, 255, 0.75);

    transition:
        background 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;
}

.control-button:hover {
    background:
        linear-gradient(
            145deg,
            rgba(234, 221, 255, 0.96),
            rgba(213, 192, 249, 0.94)
        );

    border-color: rgba(164, 133, 213, 0.72);

    box-shadow:
        0 6px 16px rgba(125, 95, 170, 0.24),
        inset 0 1px 2px rgba(255, 255, 255, 0.90);

    transform: translateY(-1px);
}

.control-button:active {
    transform: translateY(1px);

    box-shadow:
        0 2px 6px rgba(125, 95, 170, 0.18),
        inset 0 2px 4px rgba(125, 95, 170, 0.10);
}

/*
   قبلاً دکمه‌ها از نظر ظاهری همیشه فعال بودند.
   همین حالت حفظ شده.
*/

.control-button:disabled {
    opacity: 1;
    cursor: pointer;

    box-shadow:
        0 4px 10px rgba(125, 95, 170, 0.18),
        inset 0 1px 1px rgba(255, 255, 255, 0.75);

    transform: none;
}

/* =========================================================
   ZOOM BUTTON
   ========================================================= */

/*
   چون صفحه RTL است،
   این order باعث می‌شود Zoom در سمت چپ پنل قرار بگیرد.
*/

#zoomButton {
    order: 10;

    color: #73549c;

    border-color:
        rgba(170, 143, 214, 0.58);

    background:
        linear-gradient(
            145deg,
            rgba(228, 213, 255, 0.90),
            rgba(207, 185, 245, 0.84)
        );
}

#zoomButton:hover {
    background:
        linear-gradient(
            145deg,
            rgba(238, 226, 255, 0.98),
            rgba(214, 194, 248, 0.96)
        );
}

/* =========================================================
   PROGRESS
   ========================================================= */

#progress {
    flex: 1;

    min-width: 50px;

    height: 6px;

    accent-color: #a98bd3;

    cursor: pointer;

    direction: rtl;
}

/* =========================================================
   PAGE COUNTER
   ========================================================= */

.page-counter {
    min-width: 65px;

    text-align: center;

    font-size: 14px;
    font-weight: 500;

    color: #735a92;

    direction: ltr;

    white-space: nowrap;
}

/* =========================================================
   THEME BUTTON
   ========================================================= */

#themeButton {
    color: #73549c;

    border-color:
        rgba(170, 143, 214, 0.58);

    background:
        linear-gradient(
            145deg,
            rgba(228, 213, 255, 0.90),
            rgba(207, 185, 245, 0.84)
        );
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    .app {
        padding:
            5px
            5px
            max(5px, env(safe-area-inset-bottom));
    }

    .controls {
        width: 100%;

        margin-top: 8px;

        padding: 7px 8px;

        gap: 6px;

        border-radius: 13px;
    }

    .control-button {
        width: 38px;
        height: 36px;

        font-size: 15px;
    }
    #volumeControl {
    width: 50px;
}
    .page-counter {
        min-width: 55px;
        font-size: 12px;
    }

}

@media (max-width: 900px) and (orientation: landscape) {

    .controls {
        margin-top: 6px;
        padding-top: 5px;
        padding-bottom: 5px;
    }

}

/* =========================================================
   MOUSE CURSOR WHEN ZOOMED
   ========================================================= */

.page-inner.zoomed {
    cursor: grab;
}

.page-inner.zoomed.dragging {
    cursor: grabbing;
}

.page-inner.zoomed #pdfCanvas {
    cursor: grab;
}

.page-inner.zoomed.dragging #pdfCanvas {
    cursor: grabbing;
}

</style>

</head>

<script>

/* =========================================================
   PDF FILES
   ========================================================= */

const PHONE_PDF_BASE =
    "https://pad-hanis.github.io/digital-book/ppt/Phone/";

const PC_PDF_BASE =
    "https://pad-hanis.github.io/digital-book/ppt/PC/";

let PHONE_PDFS = [];
let PC_PDFS = [];

async function loadPDFFiles(baseURL, baseName) {
    try {
        const folderURL =
            baseURL.replace(
                "https://pad-hanis.github.io/digital-book/",
                "https://api.github.com/repos/pad-hanis/digital-book/contents/"
            );

        const response =
            await fetch(folderURL);

        if (!response.ok) {
            throw new Error(
                "Cannot read PDF folder"
            );
        }

        const files =
            await response.json();

        return files
            .filter(function(file) {
                return (
                    file.type === "file" &&
                    file.name
                        .toLowerCase()
                        .endsWith(".pdf") &&
                    (
                        file.name
                            .toLowerCase()
                            .startsWith(
                                baseName.toLowerCase()
                            )
                    )
                );
            })
            .map(function(file) {
                return file.name;
            })
            .sort(function(a, b) {

                function getNumber(name) {
                    const match =
                        name.match(
                            new RegExp(
                                "^" +
                                baseName +
                                "(\\d*)\\.pdf$",
                                "i"
                            )
                        );

                    if (!match) {
                        return Infinity;
                    }

                    return match[1] === ""
                        ? 0
                        : Number(match[1]);
                }

                return (
                    getNumber(a) -
                    getNumber(b)
                );
            });
    }
    catch (error) {
        console.error(
            "PDF folder error:",
            error
        );

        return [];
    }
}

async function initializePDFFiles() {

    PHONE_PDFS =
        await loadPDFFiles(
            PHONE_PDF_BASE,
            "Phone"
        );

    PC_PDFS =
        await loadPDFFiles(
            PC_PDF_BASE,
            "PC"
        );

    console.log(
        "Phone PDFs:",
        PHONE_PDFS
    );

    console.log(
        "PC PDFs:",
        PC_PDFS
    );

    loadPDF(1);
}
/* =========================================================
   MUSIC
   ========================================================= */

const MUSIC_BASE =
    "https://pad-hanis.github.io/digital-book/ppt/Music/";

let MUSIC_FILES = [];
const musicCache = {};
let currentMusicFile = null;
let musicStartedByUser = false;
let musicMuted = false;

async function loadMusicFiles() {
    try {
        const response = await fetch(
            "https://api.github.com/repos/pad-hanis/digital-book/contents/ppt/Music"
        );

        if (!response.ok) {
            throw new Error("Cannot read Music folder");
        }

        const files = await response.json();

        MUSIC_FILES = files
            .filter(function(file) {
                return (
                    file.type === "file" &&
                    file.name.toLowerCase().endsWith(".mp3")
                );
            })
            .map(function(file) {
                return file.name;
            });

        console.log(
            "Music files:",
            MUSIC_FILES
        );

        preloadMusic();
    }
    catch (error) {
        console.error(
            "Music folder error:",
            error
        );
    }
}

/* =========================================================
   PDF.JS
   ========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   DOM
   ========================================================= */

const canvas =
    document.getElementById("pdfCanvas");

const ctx =
    canvas.getContext("2d");

const content =
    document.getElementById("content");

const loading =
    document.getElementById("loading");

const prev =
    document.getElementById("prev");

const next =
    document.getElementById("next");

const progress =
    document.getElementById("progress");

const current =
    document.getElementById("current");

const total =
    document.getElementById("total");

const themeButton =
    document.getElementById("themeButton");

const zoomButton =
    document.getElementById("zoomButton");


/* =========================================================
   PDF STATE
   ========================================================= */

let pdfDocument = null;

let currentPage = 1;

let totalPages = 0;

let currentOrientation = null;

let rendering = false;

let renderAgain = false;

let renderToken = 0;

let pdfPageInfo = [];

let currentPDFIndex = -1;

const pageCache = new Map();

/* =========================================================
   MUSIC FUNCTIONS
   ========================================================= */


   function getMusicRange(fileName) {
    const name =
        fileName.replace(/\.mp3$/i, "");

    const parts =
        name.split("_");

    let range =
        parts[parts.length - 1];

    if (
        range.toUpperCase() === "LOOP" &&
        parts.length >= 2
    ) {
        range =
            parts[parts.length - 2];
    }

    if (/^\d+$/.test(range)) {
        const page =
            Number(range);

        return {
            file: fileName,
            start: page,
            end: page
        };
    }

    const rangeParts =
        range.split("-");

    if (
        rangeParts.length === 2 &&
        /^\d+$/.test(rangeParts[0]) &&
        /^\d+$/.test(rangeParts[1])
    ) {
        return {
            file: fileName,
            start: Number(rangeParts[0]),
            end: Number(rangeParts[1])
        };
    }

    return null;
}

  

function getMusicForPage(pageNumber) {

    for (const fileName of MUSIC_FILES) {

        const range =
            getMusicRange(fileName);

        if (!range) {
            continue;
        }

        if (
            pageNumber >= range.start &&
            pageNumber <= range.end
        ) {
            return fileName;
        }
    }

    return null;
}


function preloadMusic() {

    MUSIC_FILES.forEach(function(fileName) {

        const audio =
            new Audio();

        audio.src =
            MUSIC_BASE + fileName;

        audio.preload =
            "auto";

        audio.volume =
            0.85;

        musicCache[fileName] =
            audio;

        audio.load();

    });

}


async function playMusicForPage(pageNumber) {

    const musicFile =
        getMusicForPage(pageNumber);

    if (!musicFile) {

        if (currentMusicFile) {

            const oldAudio =
                musicCache[currentMusicFile];

            if (oldAudio) {
                oldAudio.pause();
                oldAudio.currentTime = 0;
            }

            currentMusicFile = null;
        }

        return;
    }

    const audio =
        musicCache[musicFile];

    if (!audio) {
        return;
    }

    if (
        currentMusicFile === musicFile &&
        !audio.paused
    ) {
        return;
    }

    if (
        currentMusicFile &&
        currentMusicFile !== musicFile
    ) {

        const oldAudio =
            musicCache[currentMusicFile];

        if (oldAudio) {
            oldAudio.pause();
            oldAudio.currentTime = 0;
        }
    }

    audio.volume =
    Number(volumeControl.value);

    audio.loop =
    musicFile
        .toUpperCase()
        .includes("_LOOP");

    try {

        await audio.play();

        currentMusicFile =
            musicFile;

        musicStartedByUser =
            true;

    }

    catch (error) {

        console.log(
            "Music autoplay waiting for user interaction."
        );

    }
}

const muteButton =
    document.getElementById("muteButton");

muteButton.addEventListener(
    "click",
    function() {
        musicMuted =
            !musicMuted;

        Object.values(musicCache).forEach(
            function(audio) {
                audio.muted =
                    musicMuted;
            }
        );

        muteButton.textContent =
            musicMuted ? "🔇" : "🔊";

        muteButton.title =
            musicMuted ? "فعال کردن صدا" : "بی‌صدا کردن";
    }
);

const volumeControl =
    document.getElementById("volumeControl");

volumeControl.addEventListener(
    "input",
    function() {
        const volume =
            Number(volumeControl.value);

        Object.values(musicCache).forEach(
            function(audio) {
                audio.volume =
                    volume;
            }
        );

        if (
            volume > 0 &&
            musicMuted
        ) {
            musicMuted =
                false;

            Object.values(musicCache).forEach(
                function(audio) {
                    audio.muted =
                        false;
                }
            );

            muteButton.textContent =
                "🔊";

            muteButton.title =
                "بی‌صدا کردن";
        }
    }
);
/* =========================================================
   ZOOM STATE
   ========================================================= */

let zoomLevel = 1;

const MIN_ZOOM = 1;

const MAX_ZOOM = 4;

const ZOOM_STEP = 0.25;

let panX = 0;

let panY = 0;


/* =========================================================
   MOUSE PAN
   ========================================================= */

let mousePanning = false;

let mouseLastX = 0;

let mouseLastY = 0;


/* =========================================================
   TOUCH STATE
   ========================================================= */

let touchStartX = 0;

let touchStartY = 0;

let touchMoved = false;

let touchStartTime = 0;

let pinchStartDistance = 0;

let pinchStartZoom = 1;

let isPinching = false;


/* =========================================================
   VIEWPORT
   ========================================================= */

function updateViewportSize() {

    const viewport =
        window.visualViewport;

    const height =
        viewport
            ? viewport.height
            : window.innerHeight;

    const width =
        viewport
            ? viewport.width
            : window.innerWidth;

    document.documentElement
        .style
        .setProperty(
            "--viewport-height",
            height + "px"
        );

    /*
       ارتفاع پنل قبلی حفظ شده.
       فقط برای جلوگیری از برخورد
       پنل با PDF مقدار متغیر می‌گیرد.
    */

    let controlsHeight = 61;

    if (width <= 700) {
        controlsHeight = 51;
    }

    if (
        width <= 900 &&
        width > height
    ) {
        controlsHeight = 48;
    }

    document.documentElement
        .style
        .setProperty(
            "--controls-height",
            controlsHeight + "px"
        );
}


/* =========================================================
   ORIENTATION
   ========================================================= */

function getOrientation() {

    return window.innerWidth <
        window.innerHeight
        ? "portrait"
        : "landscape";
}


/* =========================================================
   PDF URL
   ========================================================= */

function getPDFURL() {
    const pdfList =
        getOrientation() === "portrait"
            ? PHONE_PDFS
            : PC_PDFS;

    const pdfBase =
        getOrientation() === "portrait"
            ? PHONE_PDF_BASE
            : PC_PDF_BASE;

    if (!pdfList.length) {
        return null;
    }

    return pdfBase + pdfList[0];
}

/* =========================================================
   CLAMP PAN
   ========================================================= */

function clampPan() {

    const extraX =
        Math.max(
            0,
            (
                canvas.clientWidth *
                zoomLevel -
                content.clientWidth
            ) / 2
        );

    const extraY =
        Math.max(
            0,
            (
                canvas.clientHeight *
                zoomLevel -
                content.clientHeight
            ) / 2
        );

    panX =
        Math.max(
            -extraX,
            Math.min(
                extraX,
                panX
            )
        );

    panY =
        Math.max(
            -extraY,
            Math.min(
                extraY,
                panY
            )
        );
}


/* =========================================================
   APPLY ZOOM
   ========================================================= */

function applyZoom() {

    clampPan();

    canvas.style.transform =
        `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;

    if (zoomLevel > 1) {

        content.classList.add("zoomed");

        zoomButton.textContent = "↺";

        zoomButton.title =
            "بازگشت به اندازه اصلی";

    } else {

        content.classList.remove("zoomed");

        content.classList.remove("dragging");

        zoomButton.textContent = "🔍";

        zoomButton.title = "زوم";
    }
}


/* =========================================================
   RESET ZOOM
   ========================================================= */

function resetZoom() {

    zoomLevel = 1;

    panX = 0;

    panY = 0;

    applyZoom();
}


/* =========================================================
   ZOOM AT POINT
   ========================================================= */

function zoomAtPoint(
    newZoom,
    clientX,
    clientY
) {

    const oldZoom =
        zoomLevel;

    newZoom =
        Math.max(
            MIN_ZOOM,
            Math.min(
                MAX_ZOOM,
                newZoom
            )
        );

    if (newZoom === oldZoom) {
        return;
    }


    const rect =
        content.getBoundingClientRect();


    const pointX =
        clientX -
        (rect.left + rect.width / 2);

    const pointY =
        clientY -
        (rect.top + rect.height / 2);


    /*
       کاری می‌کنیم نقطه‌ای که
       زیر انگشت/موس است،
       هنگام زوم همانجا باقی بماند.
    */

    const ratio =
        newZoom / oldZoom;


    panX =
        pointX -
        (pointX - panX) * ratio;

    panY =
        pointY -
        (pointY - panY) * ratio;


    zoomLevel =
        newZoom;


    clampPan();

    applyZoom();
}


/* =========================================================
   ZOOM BUTTON
   ========================================================= */

zoomButton.addEventListener(
    "click",
    function() {

        if (zoomLevel === 1) {

            /*
               اولین کلیک:
               زوم به 2x
            */

            const rect =
                content.getBoundingClientRect();

            zoomAtPoint(
                2,
                rect.left +
                rect.width / 2,
                rect.top +
                rect.height / 2
            );

        } else {

            /*
               کلیک دوباره:
               Zoom Out / Reset
            */

            resetZoom();
        }

    }
);


/* =========================================================
   MOUSE WHEEL ZOOM
   ========================================================= */

content.addEventListener(
    "wheel",
    function(event) {

        event.preventDefault();

        const direction =
            event.deltaY < 0
                ? 1
                : -1;

        const newZoom =
            zoomLevel +
            direction * ZOOM_STEP;

        zoomAtPoint(
            newZoom,
            event.clientX,
            event.clientY
        );

    },
    {
        passive: false
    }
);


/* =========================================================
   MOUSE LEFT-CLICK PAN
   ========================================================= */

content.addEventListener(
    "mousedown",
    function(event) {

        if (
            event.button !== 0 ||
            zoomLevel <= 1
        ) {
            return;
        }

        mousePanning = true;

        mouseLastX =
            event.clientX;

        mouseLastY =
            event.clientY;

        content.classList.add(
            "dragging"
        );

        event.preventDefault();

    }
);


/* =========================================================
   MOUSE MOVE
   ========================================================= */

window.addEventListener(
    "mousemove",
    function(event) {

        if (!mousePanning) {
            return;
        }

        const dx =
            event.clientX -
            mouseLastX;

        const dy =
            event.clientY -
            mouseLastY;

        panX += dx;

        panY += dy;

        mouseLastX =
            event.clientX;

        mouseLastY =
            event.clientY;

        clampPan();

        applyZoom();

        content.classList.add(
            "dragging"
        );

        event.preventDefault();

    }
);


/* =========================================================
   MOUSE UP
   ========================================================= */

window.addEventListener(
    "mouseup",
    function() {

        if (!mousePanning) {
            return;
        }

        mousePanning = false;

        content.classList.remove(
            "dragging"
        );

        if (zoomLevel > 1) {
            content.classList.add(
                "zoomed"
            );
        }

    }
);


/* =========================================================
   TOUCH DISTANCE
   ========================================================= */

function getTouchDistance(
    touch1,
    touch2
) {

    const dx =
        touch2.clientX -
        touch1.clientX;

    const dy =
        touch2.clientY -
        touch1.clientY;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


/* =========================================================
   TOUCH CENTER
   ========================================================= */

function getTouchCenter(
    touch1,
    touch2
) {

    return {
        x:
            (
                touch1.clientX +
                touch2.clientX
            ) / 2,

        y:
            (
                touch1.clientY +
                touch2.clientY
            ) / 2
    };

}


/* =========================================================
   TOUCH START
   ========================================================= */

content.addEventListener(
    "touchstart",
    function(event) {

        touchMoved = false;

        touchStartTime =
            Date.now();


        /*
           دو انگشت:
           Pinch Zoom
        */

        if (
            event.touches.length === 2
        ) {

            isPinching = true;

            pinchStartDistance =
                getTouchDistance(
                    event.touches[0],
                    event.touches[1]
                );

            pinchStartZoom =
                zoomLevel;

            return;
        }


        /*
           یک انگشت:
           شروع Swipe یا Pan
        */

        if (
            event.touches.length === 1
        ) {

            touchStartX =
                event.touches[0].clientX;

            touchStartY =
                event.touches[0].clientY;
        }

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH MOVE
   ========================================================= */

content.addEventListener(
    "touchmove",
    function(event) {

        /*
           دو انگشت = PINCH
        */

        if (
            event.touches.length === 2
        ) {

            isPinching = true;

            const distance =
                getTouchDistance(
                    event.touches[0],
                    event.touches[1]
                );

            if (
                pinchStartDistance <= 0
            ) {
                return;
            }


            const scale =
                distance /
                pinchStartDistance;


            const newZoom =
                pinchStartZoom *
                scale;


            const center =
                getTouchCenter(
                    event.touches[0],
                    event.touches[1]
                );


            zoomAtPoint(
                newZoom,
                center.x,
                center.y
            );


            touchMoved = true;

            event.preventDefault();

            return;
        }


        /*
           یک انگشت در حالت Zoom:
           حرکت دادن صفحه
        */

        if (
            event.touches.length === 1 &&
            zoomLevel > 1
        ) {

            const currentX =
                event.touches[0].clientX;

            const currentY =
                event.touches[0].clientY;


            const dx =
                currentX -
                touchStartX;

            const dy =
                currentY -
                touchStartY;


            if (
                Math.abs(dx) > 2 ||
                Math.abs(dy) > 2
            ) {

                touchMoved = true;

                panX += dx;

                panY += dy;


                touchStartX =
                    currentX;

                touchStartY =
                    currentY;


                clampPan();

                applyZoom();


                event.preventDefault();
            }

        }

    },
    {
        passive: false
    }
);

/* =========================================================
   PDF PAGE INFO
   ========================================================= */

async function getPDFPageInfo(
    pdfList,
    pdfBase
) {

    const pdfInfo = [];

    let total = 0;

    for (
        let i = 0;
        i < pdfList.length;
        i++
    ) {

        const pdfURL =
            pdfBase + pdfList[i];

        const pdf =
            await pdfjsLib
                .getDocument({
                    url: pdfURL,
                    disableFontFace: true
                })
                .promise;

        const startPage =
            total + 1;

        const endPage =
            total + pdf.numPages;

        pdfInfo.push({
            file: pdfList[i],
            startPage: startPage,
            endPage: endPage,
            numPages: pdf.numPages
        });

        total =
            endPage;

        await pdf.destroy();
    }

    return {
        files: pdfInfo,
        totalPages: total
    };
}


/* =========================================================
   LOAD PDF
   ========================================================= */

async function loadPDF(
    preservePage = 1
) {

    const orientation =
        getOrientation();

    currentOrientation =
        orientation;

    const pdfList =
        orientation === "portrait"
            ? PHONE_PDFS
            : PC_PDFS;

    const pdfBase =
        orientation === "portrait"
            ? PHONE_PDF_BASE
            : PC_PDF_BASE;

    try {

        loading.style.display =
            "flex";

        loading.textContent =
            "در حال آماده‌سازی PDF...";

        if (!pdfList.length) {
            throw new Error(
                "No PDF files found"
            );
        }

        const info =
            await getPDFPageInfo(
                pdfList,
                pdfBase
            );

        pdfPageInfo =
            info.files;

        totalPages =
            info.totalPages;

        total.textContent =
            totalPages;

        progress.min = 1;

        progress.max =
            totalPages;

        currentPDFIndex = -1;

        if (pdfDocument) {

            await pdfDocument.destroy();

            pdfDocument =
                null;
        }

        await showPage(
            preservePage
        );

    }

    catch (error) {

        loading.style.display =
            "flex";

        loading.textContent =
            "خطا در بارگذاری PDF";

        console.error(error);

    }

}


async function showPage(
    pageNumber
) {

    if (!pdfPageInfo.length) {
        return;
    }

    if (pageNumber < 1) {
        pageNumber = 1;
    }

    if (
        pageNumber >
        totalPages
    ) {
        pageNumber =
            totalPages;
    }

    currentPage =
        pageNumber;

    current.textContent =
        currentPage;

    progress.value =
        currentPage;

    playMusicForPage(
        currentPage
    );

    loading.style.display =
        "flex";

    loading.textContent =
        "در حال نمایش صفحه " +
        currentPage +
        "...";

    resetZoom();

    try {

        /*
           پیدا کردن PDF مربوط به
           شماره صفحه کلی
        */

        let targetPDFIndex = -1;

        for (
            let i = 0;
            i < pdfPageInfo.length;
            i++
        ) {

            if (
                currentPage >=
                    pdfPageInfo[i].startPage &&
                currentPage <=
                    pdfPageInfo[i].endPage
            ) {

                targetPDFIndex =
                    i;

                break;
            }
        }

        if (
            targetPDFIndex === -1
        ) {
            throw new Error(
                "PDF for page not found"
            );
        }

        const targetPDF =
            pdfPageInfo[
                targetPDFIndex
            ];

        /*
           شماره صفحه داخل PDF
        */

        const localPage =
            currentPage -
            targetPDF.startPage +
            1;

        /*
           اگر PDF فعلی همان PDF موردنظر نیست،
           PDF جدید را باز می‌کنیم.
        */

        if (
            currentPDFIndex !==
            targetPDFIndex
        ) {

            if (pdfDocument) {

                await pdfDocument.destroy();

                pdfDocument =
                    null;
            }

            const orientation =
                getOrientation();

            const pdfBase =
                orientation === "portrait"
                    ? PHONE_PDF_BASE
                    : PC_PDF_BASE;

            const pdfURL =
                pdfBase +
                targetPDF.file;

            pdfDocument =
                await pdfjsLib
                    .getDocument({
                        url: pdfURL,
                        disableFontFace: true
                    })
                    .promise;

            currentPDFIndex =
                targetPDFIndex;
        }

        /*
           دریافت صفحه واقعی داخل PDF
        */

        const page =
            await pdfDocument
                .getPage(
                    localPage
                );

        const baseViewport =
            page.getViewport({
                scale: 1
            });

        const availableWidth =
            content.clientWidth - 2;

        const availableHeight =
            content.clientHeight - 2;

        const scaleX =
            availableWidth /
            baseViewport.width;

        const scaleY =
            availableHeight /
            baseViewport.height;

        const scale =
            Math.min(
                scaleX,
                scaleY
            );

        const viewport =
            page.getViewport({
                scale: scale
            });

        const deviceScale =
            window.devicePixelRatio ||
            1;

        canvas.width =
            Math.floor(
                viewport.width *
                deviceScale
            );

        canvas.height =
            Math.floor(
                viewport.height *
                deviceScale
            );

        canvas.style.width =
            viewport.width +
            "px";

        canvas.style.height =
            viewport.height +
            "px";

        ctx.setTransform(
            deviceScale,
            0,
            0,
            deviceScale,
            0,
            0
        );

        await page.render({
            canvasContext: ctx,
            viewport: viewport
        }).promise;

        loading.style.display =
            "none";

        applyZoom();

    }
    catch (error) {

        loading.style.display =
            "flex";

        loading.textContent =
            "خطا در نمایش صفحه";

        console.error(error);

    }

}

/* =========================================================
   ORIENTATION CHANGE
   ========================================================= */

let orientationTimer;


async function handleOrientationChange() {

    clearTimeout(
        orientationTimer
    );


    orientationTimer =
        setTimeout(
            async function() {

                updateViewportSize();


                const newOrientation =
                    getOrientation();


                if (
                    newOrientation !==
                    currentOrientation
                ) {

                    const savedPage =
                        currentPage;


                    currentOrientation =
                        newOrientation;


                    await loadPDF(
                        savedPage
                    );

                }

                else {

                    await showPage(
                        currentPage
                    );

                }

            },
            150
        );

}

let resizeTimer;


function handleResize() {

                    getOrientation();


                if (
                    newOrientation !==
                    currentOrientation
                ) {

                    handleOrientationChange();

                }

                else {

                    showPage(
                        currentPage
                    );

                }

            },
            200
        );

}
